server:
  port: ${SERVER_PORT:8080}
  base-url: ${SERVER_BASE_URL:http://localhost:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: motorbike-flood-rescue-backend
  config:
    import:
      - optional:file:backend/.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  security:
    storage-path: ${APP_SECURITY_STORAGE_PATH:storage/secure-kyc}
    storage-key: ${APP_SECURITY_STORAGE_KEY:}
    hmac-secret: ${APP_SECURITY_HMAC_SECRET:}
    encryption-key: ${APP_SECURITY_ENCRYPTION_KEY:}
  demo:
    seed-users: ${APP_DEMO_SEED_USERS:false}
  rescue:
    booking-fee: ${RESCUE_BOOKING_FEE:30000}
    hotline: ${RESCUE_HOTLINE:1900-6868}
    offer-timeout-seconds: ${RESCUE_OFFER_TIMEOUT_SECONDS:45}
    arrival-threshold-meters: ${RESCUE_ARRIVAL_THRESHOLD_METERS:30.0}
    heartbeat-valid-minutes: ${RESCUE_HEARTBEAT_VALID_MINUTES:5}
    default-dispatch-radius-km: ${RESCUE_DEFAULT_RADIUS_KM:5.0}
    max-dispatch-radius-km: ${RESCUE_MAX_RADIUS_KM:7.0}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

payos:
  client-id: ${PAYOS_CLIENT_ID:demo_client_id}
  api-key: ${PAYOS_API_KEY:demo_api_key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:demo_checksum_key}
  endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:http://localhost:8080/api/v1/payments/payos/return}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:8080/api/v1/payments/payos/return?cancel=true}
  simulation-enabled: ${PAYOS_SIMULATION_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:*,http://127.0.0.1:*}
